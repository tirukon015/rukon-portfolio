name: Build and Verify Portfolio

on:
  push:
    branches: [ main, master, backup/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Confidentiality and data tests
        run: npm test

      - name: Build Next.js
        run: npm run build

      - name: Start the production build
        run: |
          npx next start -p 3100 &
          for i in $(seq 1 60); do curl -sf http://localhost:3100/robots.txt >/dev/null && exit 0; sleep 1; done
          echo "server did not start"; exit 1

      # Routes, sitemap, internal links, images, metadata, JSON-LD, feed,
      # robots, 404s and the confidentiality scan of pages and browser chunks.
      - name: Site check
        run: npm run check:site

      # Real browser (the runner's installed Chrome): console, network,
      # overflow at ten widths, project clicks, mobile menu, filters, axe, CLS.
      - name: Browser check
        env:
          BROWSER_CHANNEL: chrome
        run: npm run check:browser -- --quick
